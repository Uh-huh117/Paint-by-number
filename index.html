<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080b16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Bead Paint"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>Bead Paint</title><style>
:root{--bg:#080b16;--panel:#151a2a;--panel2:#20283b;--line:#34405a;--text:#f5f7ff;--muted:#9da8c0;--cyan:#00e5ff;--pink:#ff3d9a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}button:active{transform:scale(.97)}.primary{background:linear-gradient(135deg,#7137b9,#00a8c0);border-color:#53e9ff}.app{height:100%;display:flex;flex-direction:column}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);background:#0a0d1af5;z-index:30}.brand{font-weight:900}.brand span{color:var(--cyan)}.actions{display:flex;gap:6px}.workspace{position:relative;flex:1;overflow:hidden}.viewport{position:absolute;inset:0;overflow:hidden;background:#050811;touch-action:none}#canvas{position:absolute;left:0;top:0;image-rendering:pixelated;transform-origin:0 0}.sidebar{position:absolute;z-index:20;left:0;top:0;bottom:0;width:300px;background:#111625f7;border-right:1px solid var(--line);padding:12px;overflow:auto;transition:transform .25s ease;box-shadow:12px 0 35px #0006}.sidebar.closed{transform:translateX(-100%)}.tab{position:fixed;z-index:50;left:0;top:50%;transform:translateY(-50%);width:34px;height:62px;border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0;background:#151a2afa;color:var(--cyan);font-size:20px}.sidebar:not(.closed)~.tab{left:300px}.card{background:#ffffff09;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:10px}.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--cyan);margin:0 0 9px}.file{display:block;text-align:center;border:2px dashed var(--line);padding:12px;border-radius:10px;color:var(--muted)}.file input{display:none}.row{display:flex;gap:8px}.row>*{flex:1}label.small{font-size:11px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--cyan)}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:240px;overflow:auto}.swatch{height:45px;padding:0;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid #0005}.swatch.active{outline:2px solid white;box-shadow:0 0 13px white}.swatch.done{opacity:.35}.swatch.done:after{content:"✓";position:absolute;font-size:18px;text-shadow:0 1px 3px #000}.progress{height:8px;background:#2a3040;border-radius:8px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));width:0}#status{font-size:11px;color:var(--muted);margin-top:6px}.hud{position:absolute;right:14px;bottom:14px;display:flex;gap:7px}.hud button{width:44px;height:44px;border-radius:50%;padding:0}.gallery{position:fixed;inset:0;z-index:100;background:#050812fa;overflow:auto;padding:18px}.galleryHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.galleryHead h2{margin:0}.galleryHead small{color:var(--muted)}.galleryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.project{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}.project canvas{width:100%;aspect-ratio:1;display:block;background:#fff;border-radius:9px;image-rendering:pixelated}.project strong{display:block;margin-top:8px}.project small{color:var(--muted)}.newProject{min-height:220px;border:2px dashed var(--pink);display:flex;align-items:center;justify-content:center;text-align:center;color:#ff77ba;font-weight:800;font-size:18px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:200;background:#20283b;border:1px solid var(--line);border-radius:10px;padding:9px 13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}@media(max-width:700px){.sidebar{width:280px}.sidebar:not(.closed)~.tab{left:280px}.actions button{padding:8px}.actions button span{display:none}}
</style></head><body><div class="app"><header><div class="brand">✦ <span>BEAD PAINT</span></div><div class="actions"><button id="galleryBtn">🎨 Gallery</button><button id="saveBtn">💾 Save</button></div></header><div class="workspace"><aside class="sidebar" id="sidebar"><div class="card"><h3>New Image</h3><label class="file">📷 Choose an image<input id="image" type="file" accept="image/*"></label></div><div class="card"><h3>Pattern</h3><label class="small">Pixels: <b id="pixelsVal">3600</b></label><input id="pixels" type="range" min="100" max="40000" value="3600" step="100"><label class="small">Colours: <b id="colorsVal">24</b></label><input id="colors" type="range" min="2" max="64" value="24"><button class="primary" id="generate" style="width:100%;margin-top:8px">✨ Generate Pixel Art</button></div><div class="card"><h3>Painting</h3><div class="row"><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button></div><button id="fit" style="width:100%;margin-top:8px">⌖ Fit Pattern</button></div><div class="card"><h3>Progress</h3><div class="progress"><i id="progress"></i></div><div id="status">No pattern yet.</div></div><div class="card"><h3>Colours</h3><div class="palette" id="palette"></div></div></aside><div class="viewport" id="viewport"><canvas id="canvas"></canvas><div class="hud"><button id="zoomOut">−</button><button id="zoomIn">+</button></div></div><button class="tab" id="sidebarTab" aria-label="Toggle sidebar">›</button></div></div><div class="gallery" id="gallery" hidden><div class="galleryHead"><div><h2>Your Gallery</h2><small>Projects are stored locally on this device.</small></div><div class="actions"><button id="newProject" class="primary">＋ New Project</button><button id="closeGallery">Back</button></div></div><div class="galleryGrid" id="galleryGrid"></div></div><div class="toast" id="toast"></div>
<script>(()=>{const $=id=>document.getElementById(id);let source=null,w=60,h=60,pal=[],grid=[],filled=[],sel=0,scale=1,px=0,py=0,drawing=false,last=-1,undo=[],redo=[],pid='project_'+Date.now();const c=$('canvas'),x=c.getContext('2d'),v=$('viewport');function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1400)}function toggle(){let s=$('sidebar');s.classList.toggle('closed');$('sidebarTab').textContent=s.classList.contains('closed')?'›':'‹'}$('sidebarTab').onclick=toggle;$('pixels').oninput=e=>$('pixelsVal').textContent=Number(e.target.value).toLocaleString();$('colors').oninput=e=>$('colorsVal').textContent=e.target.value;$('image').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{source=im;generate()};im.src=r.result};r.readAsDataURL(f)};$('generate').onclick=generate;$('fit').onclick=fit;$('zoomIn').onclick=()=>zoom(1.25);$('zoomOut').onclick=()=>zoom(.8);$('undo').onclick=undoOne;$('redo').onclick=redoOne;$('saveBtn').onclick=save;$('galleryBtn').onclick=gallery;$('closeGallery').onclick=()=>{$('gallery').hidden=true};$('newProject').onclick=newProject;function newProject(){pid='project_'+Date.now();source=null;grid=[];filled=[];pal=[];sel=0;undo=[];redo=[];$('image').value='';$('gallery').hidden=true;renderPal();draw();update();$('image').click();toast('Choose an image for your new project.')}function generate(){if(!source){toast('Choose an image first.');return}let target=+$('pixels').value,k=+$('colors').value,aspect=source.naturalHeight/source.naturalWidth;w=Math.max(10,Math.round(Math.sqrt(target/aspect)));h=Math.max(10,Math.round(w*aspect));let sc=document.createElement('canvas');sc.width=w;sc.height=h;let q=sc.getContext('2d',{willReadFrequently:true});let fit=Math.max(w/source.naturalWidth,h/source.naturalHeight),dw=source.naturalWidth*fit,dh=source.naturalHeight*fit;q.fillStyle='#fff';q.fillRect(0,0,w,h);q.drawImage(source,(w-dw)/2,(h-dh)/2,dw,dh);let d=q.getImageData(0,0,w,h).data,pts=[];for(let i=0;i<d.length;i+=4)pts.push([d[i],d[i+1],d[i+2]]);pal=quantize(pts,k);grid=Array.from({length:h},()=>new Int16Array(w));filled=Array.from({length:h},()=>new Int16Array(w).fill(-1));for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){let p=pts[y*w+xx];grid[y][xx]=closest(p[0],p[1],p[2])}sel=0;undo=[];redo=[];resize();renderPal();fit();update();toast('Pattern created.')}function quantize(pts,k){let cs=[];for(let i=0;i<k;i++)cs.push(pts[Math.min(pts.length-1,Math.floor(i*pts.length/k))].slice());for(let it=0;it<6;it++){let sums=Array.from({length:k},()=>[0,0,0,0]);for(let i=0;i<pts.length;i++){let p=pts[i],b=near(p,cs);sums[b][0]+=p[0];sums[b][1]+=p[1];sums[b][2]+=p[2];sums[b][3]++}for(let i=0;i<k;i++)if(sums[i][3])cs[i]=[Math.round(sums[i][0]/sums[i][3]),Math.round(sums[i][1]/sums[i][3]),Math.round(sums[i][2]/sums[i][3])]}return cs.map((a,i)=>({id:i,r:a[0],g:a[1],b:a[2],hex:`rgb(${a[0]},${a[1]},${a[2]})`,done:false}))}function near(p,cs){let b=0,d=1e30;for(let i=0;i<cs.length;i++){let z=(p[0]-cs[i][0])**2+(p[1]-cs[i][1])**2+(p[2]-cs[i][2])**2;if(z<d){d=z;b=i}}return b}function closest(r,g,b){let z=0,d=1e30;for(let i=0;i<pal.length;i++){let p=pal[i],q=(r-p.r)**2+(g-p.g)**2+(b-p.b)**2;if(q<d){d=q;z=i}}return z}function resize(){c.width=w*16;c.height=h*16;c.dataset.s=16}function fit(){if(!c.width)return;let r=v.getBoundingClientRect();scale=Math.max(.05,Math.min((r.width-40)/c.width,(r.height-40)/c.height));px=(r.width-c.width*scale)/2;py=(r.height-c.height*scale)/2;transform();draw()}function zoom(f){let old=scale,r=v.getBoundingClientRect(),cx=r.width/2,cy=r.height/2;scale=Math.max(.05,Math.min(30,scale*f));px=cx-(cx-px)*(scale/old);py=cy-(cy-py)*(scale/old);transform()}function transform(){c.style.transform=`translate(${px}px,${py}px) scale(${scale})`}function draw(){if(!grid.length){x.fillStyle='#050811';x.fillRect(0,0,c.width,c.height);return}let s=16;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){let a=grid[y][xx],done=filled[y][xx]!=-1;x.fillStyle=done?pal[filled[y][xx]].hex:(a===sel?'#00e5ff':'#fff');x.fillRect(xx*s,y*s,s,s);x.strokeStyle=done?'#0002':'#0004';x.strokeRect(xx*s+.5,y*s+.5,s-1,s-1);if(!done){x.fillStyle=a===sel?'#001820':'#303540';x.font='bold 9px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(a+1,xx*s+s/2,y*s+s/2)}}}function renderPal(){let e=$('palette');e.innerHTML='';if(!pal.length)return;let counts=Array(pal.length).fill(0),done=Array(pal.length).fill(0);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){let a=grid[y][xx];counts[a]++;if(filled[y][xx]!=-1)done[a]++}pal.forEach((p,i)=>{p.done=counts[i]>0&&done[i]===counts[i];let b=document.createElement('button');b.className='swatch '+(i===sel?'active ':'')+(p.done?'done':'');b.style.background=p.hex;b.style.color=(p.r*.299+p.g*.587+p.b*.114)>140?'#000':'#fff';b.textContent=i+1;b.onclick=()=>{sel=i;renderPal();draw()};e.appendChild(b)})}function update(){if(!grid.length){$('progress').style.width='0';$('status').textContent='No pattern yet.';return}let total=w*h,n=0;for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++)if(filled[y][xx]!=-1)n++;let pc=Math.floor(n/total*100);$('progress').style.width=pc+'%';$('status').textContent=`${n.toLocaleString()} / ${total.toLocaleString()} beads • ${pc}%`;renderPal()}function cell(e){let r=c.getBoundingClientRect(),s=16;return[Math.floor((e.clientX-r.left)/(s*scale)),Math.floor((e.clientY-r.top)/(s*scale))]}function paint(e){if(!grid.length)return;let [xx,y]=cell(e);if(xx<0||y<0||xx>=w||y>=h)return;if(grid[y][xx]!==sel||filled[y][xx]!=-1)return;let id=y*w+xx;if(id===last)return;last=id;undo.push({x:xx,y,old:-1,nw:sel});redo=[];filled[y][xx]=sel;draw()}c.addEventListener('pointerdown',e=>{if(e.button!==0)return;drawing=true;last=-1;paint(e)});c.addEventListener('pointermove',e=>{if(drawing)paint(e)});window.addEventListener('pointerup',()=>{drawing=false;last=-1;update()});v.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:.87)},{passive:false});function undoOne(){let a=undo.pop();if(!a)return;filled[a.y][a.x]=a.old;redo.push(a);draw();update()}function redoOne(){let a=redo.pop();if(!a)return;filled[a.y][a.x]=a.nw;undo.push(a);draw();update()}function save(){if(!grid.length){toast('Nothing to save yet.');return}let data={id:pid,name:'Bead Project '+new Date().toLocaleDateString(),w,h,pal,grid:grid.map(r=>Array.from(r)),filled:filled.map(r=>Array.from(r))};try{localStorage.setItem(pid,JSON.stringify(data));toast('Project saved.')}catch(e){toast('Storage is unavailable.')}}function gallery(){let g=$('galleryGrid');g.innerHTML='';let n=document.createElement('div');n.className='project newProject';n.innerHTML='＋<br>New Project';n.onclick=newProject;g.appendChild(n);for(let i=0;i<localStorage.length;i++){let key=localStorage.key(i);if(!key||!key.startsWith('project_'))continue;let p;try{p=JSON.parse(localStorage.getItem(key))}catch(e){continue}let card=document.createElement('div');card.className='project';let pc=document.createElement('canvas');pc.width=p.w;pc.height=p.h;let q=pc.getContext('2d');for(let y=0;y<p.h;y++)for(let xx=0;xx<p.w;xx++){let z=p.filled[y][xx];q.fillStyle=z!=-1?p.pal[z].hex:'#fff';q.fillRect(xx,y,1,1)}let total=p.w*p.h,nfill=p.filled.flat().filter(z=>z!=-1).length;let title=document.createElement('strong');title.textContent=p.name||'Untitled';let meta=document.createElement('small');meta.textContent=`${Math.floor(nfill/total*100)}% complete`;card.append(pc,title,meta);let r=document.createElement('div');r.className='row';r.style.marginTop='8px';let o=document.createElement('button');o.textContent='Open';o.onclick=()=>load(key);let del=document.createElement('button');del.textContent='Delete';del.onclick=()=>{if(confirm('Delete this project?')){localStorage.removeItem(key);gallery()}};r.append(o,del);card.append(r);g.appendChild(card)}$('gallery').hidden=false}function load(key){let p=JSON.parse(localStorage.getItem(key));pid=p.id;w=p.w;h=p.h;pal=p.pal;grid=p.grid.map(r=>Int16Array.from(r));filled=p.filled.map(r=>Int16Array.from(r));sel=0;undo=[];redo=[];resize();renderPal();fit();update();$('gallery').hidden=true;toast('Project opened.')}window.addEventListener('resize',()=>{if(grid.length)fit()});$('gallery').hidden=false;gallery();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();</script></body></html>
